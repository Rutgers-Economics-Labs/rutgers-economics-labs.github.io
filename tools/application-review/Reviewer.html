<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REL · Applicant review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#272a29;font:14px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}header{height:76px;background:#fff;border-bottom:1px solid #dedfd9;display:flex;align-items:center;padding:0 30px;gap:15px}.logo{background:#bc2734;color:white;padding:10px;border-radius:10px;font-weight:800;letter-spacing:-1px}header strong{display:block;font-size:16px}header small{color:#747b76}.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.btn{background:white;border:1px solid #d6dbd6;border-radius:7px;padding:9px 13px}.primary{background:#284f43;color:white;border-color:#284f43}.workspace{display:grid;grid-template-columns:285px minmax(390px,1fr) minmax(330px,.85fr);height:calc(100vh - 76px)}aside{background:#fff;border-right:1px solid #dedfd9;overflow:auto;padding:20px 14px}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#6c746e;font-weight:700}.search{width:100%;margin:15px 0 10px;border:1px solid #d6dbd6;padding:11px;border-radius:8px}.filters{display:flex;gap:5px;margin-bottom:18px}.filters select{width:50%;border:1px solid #d6dbd6;border-radius:6px;padding:7px;background:white;font-size:12px}.candidate{width:100%;text-align:left;padding:14px 10px;border:1px solid transparent;background:white;border-radius:8px;margin:3px 0;display:flex;gap:10px}.candidate.active{background:#edf3ef;border-color:#b6cfc0}.avatar{background:#e9ece5;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#486153;font-weight:700;flex:none}.candidate strong{display:block;font-size:13px}.candidate small{display:block;color:#778078;margin-top:5px;font-size:11px}.profile{padding:28px;overflow:auto}.profile h1{font-size:30px;margin:12px 0 6px;letter-spacing:-1px}.muted{color:#768078}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.pill{background:#e8eee8;color:#42614c;padding:5px 9px;border-radius:20px;font-size:12px}.card{background:white;border:1px solid #e1e3dd;border-radius:11px;padding:20px;margin-bottom:18px}.card h2{font-size:15px;margin:0 0 18px}.question{font-size:12px;color:#69746c;line-height:1.6;margin:0 0 8px;font-weight:600}.answer{white-space:pre-wrap;line-height:1.75;overflow-wrap:anywhere;margin:0 0 22px}.answer:last-child{margin-bottom:0}.review-pane{border-left:1px solid #dedfd9;padding:24px;overflow:auto;background:#eeefeb}.decision{display:flex;gap:5px;margin:9px 0 18px}.choice{flex:1;border:1px solid #d8ded8;border-radius:6px;background:white;padding:9px 4px;font-size:12px}.choice.selected{background:#284f43;color:white;border-color:#284f43}textarea{width:100%;min-height:115px;resize:vertical;border:1px solid #d6dbd6;border-radius:7px;padding:12px;line-height:1.6;margin:9px 0}.save-row{display:flex;align-items:center;justify-content:space-between;gap:9px}.status{font-size:11px;color:#68796d;line-height:1.5}.doc-tabs{display:flex;gap:6px;margin-bottom:12px}.doc-tabs button.active{background:#284f43;color:white}.document{background:#fff;min-height:290px;border:1px solid #dce0d8;border-radius:8px;display:grid;place-items:center;text-align:center;overflow:hidden}.document iframe{width:100%;height:440px;border:0}.document p{color:#7a847d;max-width:240px;line-height:1.7}.doc-footer{font-size:11px;line-height:1.7;color:#6c786e;margin-top:10px}a{color:#315f4c}.banner{background:#fff5de;border-bottom:1px solid #ebd9aa;padding:9px 30px;font-size:12px}.banner~.workspace{height:calc(100vh - 112px)}.empty{padding:30px;text-align:center;color:#68766e}.error{color:#a72432}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}dialog{max-width:600px;border:1px solid #ccc;border-radius:12px;padding:25px}dialog::backdrop{background:#0005}:focus-visible{outline:3px solid #ca9737;outline-offset:2px}@media(max-width:1100px){.workspace{grid-template-columns:240px 1fr;height:auto}.review-pane{grid-column:2}.profile{overflow:visible}aside{grid-row:1/3}header{padding:0 15px}}@media(max-width:700px){.workspace{display:block}aside{max-height:280px}.profile,.review-pane{padding:18px}.top-actions .optional{display:none}header{gap:9px}.profile h1{font-size:26px}}
</style></head><body>
<header><div class="logo">REL</div><div><strong>Applicant workspace</strong><small>Rutgers Economics Labs · Fall 2026</small></div><div class="top-actions"><span id="count" class="muted optional"></span><button class="btn" id="refresh">Refresh</button><button class="btn optional" id="export">Export reviews</button><button class="btn" id="import">Import CSV</button><input hidden type="file" id="file" accept=".csv,text/csv"></div></header>
<div class="banner" id="banner" hidden></div>
<div class="workspace"><aside><div class="eyebrow">Applications</div><input id="search" class="search" placeholder="Search name, skill, project…" aria-label="Search all application fields"><div class="filters"><select id="track" aria-label="Review track"><option value="ds">DS decisions</option><option value="policy">Policy decisions</option></select><select id="filter" aria-label="Filter decision"><option value="all">All decisions</option><option value="">Unreviewed</option><option>No</option><option>Maybe</option><option>Interview</option></select></div><div id="list"></div></aside><main class="profile" id="profile"></main><section class="review-pane" id="review"></section></div>
<script>
const $=id=>document.getElementById(id);const live=typeof google!=='undefined'&&google.script&&google.script.run;let applicants=[],activeId=null,dirty=false,saving=false,docType='resume';const drafts=new Map();
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function field(a,re){return a.fields.find(f=>re.test(f.label))?.value||''}function name(a){return [field(a,/^first name$/i),field(a,/^last name$/i)].filter(Boolean).join(' ')||field(a,/^(full )?name$/i)||'Applicant '+a.row}function current(){return applicants.find(a=>a.id===activeId)}function review(a){return drafts.get(a.id)||a.review}function message(text,error=false){$('banner').hidden=false;$('banner').textContent=text;$('banner').className='banner'+(error?' error':'')}function api(fn,arg){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);arg===undefined?runner[fn]():runner[fn](arg)})}
function localSave(){try{localStorage.setItem('rel-review-drafts-v1',JSON.stringify(Object.fromEntries(drafts)))}catch(e){message('Browser storage is unavailable. Export your reviews to keep a backup.',true)}}
function change(key,value){const a=current();drafts.set(a.id,{...review(a),[key]:value});dirty=true;localSave();$('save-status').textContent=live?'Unsynced changes':'Saved in this browser · not synced';renderList()}
function renderList(){const q=$('search').value.toLowerCase(),track=$('track').value,filter=$('filter').value;const found=applicants.filter(a=>a.fields.some(f=>f.value.toLowerCase().includes(q))&&(filter==='all'||(review(a)[track]||'')===filter));$('count').textContent=applicants.length+' applications';$('list').replaceChildren();found.forEach(a=>{const b=el('button',undefined,'candidate'+(a.id===activeId?' active':''));b.setAttribute('aria-pressed',String(a.id===activeId));b.append(el('span',name(a).split(/\s+/).map(s=>s[0]).slice(0,2).join(''),'avatar'));const info=el('span');info.append(el('strong',name(a)),el('small',`${review(a).ds||'DS —'} · ${review(a).policy||'Policy —'}`));b.append(info);b.onclick=()=>select(a.id);$('list').append(b)});if(!found.length)$('list').append(el('div','No matching applications.','empty'))}
function select(id){if(saving)return;if(dirty&&live&&!confirm('This review has unsynced changes. Keep the local draft and switch applicants?'))return;activeId=id;dirty=drafts.has(id);docType='resume';render()}
function safeURL(value){try{const u=new URL(value);return u.protocol==='https:'||u.protocol==='http:'?u:null}catch{return null}}
function documentURLs(a,type){const fields=a.fields.filter(f=>type==='resume'?/resum[ée]/i.test(f.label):/transcript/i.test(f.label));return fields.flatMap(f=>(f.value.match(/https?:\/\/[^\s,]+/g)||[])).filter(v=>safeURL(v))}
function renderDoc(){const a=current();const panel=$('document');panel.replaceChildren();const urls=documentURLs(a,docType);$('doc-links').replaceChildren();if(!urls.length){panel.append(el('p','No '+docType+' file was supplied.'));return}const u=safeURL(urls[0]);let preview=null;if(u.hostname==='drive.google.com'){const id=u.searchParams.get('id')||u.pathname.match(/\/d\/([\w-]+)/)?.[1];if(id&&/^[\w-]+$/.test(id))preview='https://drive.google.com/file/d/'+id+'/preview'}else if(/\.pdf$/i.test(u.pathname))preview=u.href;if(preview){const frame=el('iframe');frame.src=preview;frame.title=name(a)+' '+docType;frame.referrerPolicy='no-referrer';panel.append(frame)}else panel.append(el('p','Open this document in a new tab to read it.'));urls.forEach((url,i)=>{const link=el('a','Open '+docType+(urls.length>1?' '+(i+1):'')+' ↗');link.href=url;link.target='_blank';link.rel='noopener noreferrer';$('doc-links').append(link,el('br'))})}
function render(){renderList();const a=current();$('profile').replaceChildren();$('review').replaceChildren();if(!a){$('profile').append(el('div','No applications loaded. Connect this interface in Sheets or import a response CSV.','empty'));return}const p=$('profile');const nav=el('div',undefined,'nav');nav.append(el('span','APPLICATION · ROW '+a.row,'eyebrow'));const controls=el('div');['←','→'].forEach((txt,i)=>{const b=el('button',txt,'btn');b.setAttribute('aria-label',i?'Next applicant':'Previous applicant');b.onclick=()=>{const pos=applicants.indexOf(a)+(i?1:-1);if(applicants[pos])select(applicants[pos].id)};controls.append(b)});nav.append(controls);p.append(nav,el('h1',name(a)),el('div',field(a,/email/i),'muted'));const pills=el('div',undefined,'pills');[/major/i,/graduat|class year/i,/applied before/i].forEach(re=>{const f=a.fields.find(f=>re.test(f.label));if(f&&f.value)pills.append(el('span',f.value,'pill'))});p.append(pills);const card=el('section',undefined,'card');card.append(el('h2','Complete application'));a.fields.forEach(f=>{card.append(el('div',f.label,'question'));const answer=el('div',undefined,'answer');if(!f.value)answer.textContent='Not provided';else{const parts=f.value.split(/(https?:\/\/[^\s,]+)/g);parts.forEach(part=>{const u=safeURL(part);if(u){const link=el('a',part);link.href=u.href;link.target='_blank';link.rel='noopener noreferrer';answer.append(link)}else answer.append(document.createTextNode(part))})}card.append(answer)});p.append(card);
const r=$('review'),rc=el('section',undefined,'card');rc.append(el('h2','Your assessment'));[['ds','Data science'],['policy','Policy']].forEach(([key,label])=>{rc.append(el('div',label,'question'));const group=el('div',undefined,'decision');['No','Maybe','Interview'].forEach(value=>{const b=el('button',value,'choice'+(review(a)[key]===value?' selected':''));b.setAttribute('aria-pressed',String(review(a)[key]===value));b.onclick=()=>{change(key,review(a)[key]===value?'':value);render()};group.append(b)});rc.append(group)});const label=el('label','Reviewer notes','question');label.htmlFor='notes';const notes=el('textarea');notes.id='notes';notes.placeholder='Evidence, project fit, questions for the interview…';notes.value=review(a).notes||'';notes.oninput=()=>change('notes',notes.value);rc.append(label,notes);const row=el('div',undefined,'save-row');const status=el('span',dirty?(live?'Unsynced changes':'Saved in this browser · not synced'):(live?'Loaded from Sheets':'Demo · not synced'),'status');status.id='save-status';const save=el('button',live?'Save to Sheets':'Save locally','btn primary');save.id='save';save.onclick=saveReview;row.append(status,save);rc.append(row);r.append(rc);const docs=el('section');docs.append(el('div','Application documents','eyebrow'));const tabs=el('div',undefined,'doc-tabs');['resume','transcript'].forEach(type=>{const b=el('button',type==='resume'?'Résumé':'Transcript','btn'+(type===docType?' active':''));b.onclick=()=>{docType=type;render()};tabs.append(b)});docs.append(tabs);const panel=el('div',undefined,'document');panel.id='document';const links=el('div',undefined,'doc-footer');links.id='doc-links';docs.append(panel,links,el('div','Drive previews use your Google access. If a preview asks for sign-in, open the file in a new tab.','doc-footer'));r.append(docs);renderDoc()}
async function saveReview(){const a=current(),value={...review(a)};saving=true;$('save').disabled=true;$('save-status').textContent='Saving…';try{if(live){const result=await api('saveRelReview',{id:a.id,version:a.version,...value});a.version=result.version;a.review=value;drafts.delete(a.id);localSave();dirty=false;$('save-status').textContent='Synced to Sheets · '+new Date(result.updated).toLocaleTimeString()}else{localSave();dirty=false;$('save-status').textContent='Saved in this browser · not synced'}}catch(e){message(e.message||String(e),true);$('save-status').textContent='Save failed · draft retained'}finally{saving=false;$('save').disabled=false;renderList()}}
async function load(){if(saving)return;if(dirty&&!confirm('Keep your local drafts and reload applications?'))return;if(!live){render();return}try{const result=await api('getRelApplications');applicants=result.applicants;activeId=applicants.some(a=>a.id===activeId)?activeId:applicants[0]?.id;dirty=drafts.has(activeId);$('banner').hidden=true;render()}catch(e){message(e.message||String(e),true)}}
function parseCSV(text){const rows=[];let row=[],value='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(value);value=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value);rows.push(row);row=[];value=''}else value+=c}if(quoted)throw new Error('CSV contains an unfinished quoted field.');if(value||row.length){row.push(value);rows.push(row)}return rows}
$('search').oninput=renderList;$('track').onchange=renderList;$('filter').onchange=renderList;$('refresh').onclick=load;$('import').onclick=()=>{if(live){message('CSV import is available in the local HTML preview. The connected version reads the response sheet directly.');return}$('file').click()};$('file').onchange=async e=>{try{const rows=parseCSV((await e.target.files[0].text()).replace(/^\uFEFF/,'')),headers=rows.shift();if(!headers?.length)throw new Error('Empty CSV.');applicants=rows.filter(r=>r.some(Boolean)).map((r,i)=>({id:'csv:'+JSON.stringify([headers,r]),row:i+2,fields:headers.map((label,j)=>({label,value:r[j]||''})),review:{ds:r[headers.indexOf('REL DS Decision')]||'',policy:r[headers.indexOf('REL Policy Decision')]||'',notes:r[headers.indexOf('REL Review Notes')]||''}}));activeId=applicants[0]?.id;dirty=drafts.has(activeId);message('CSV mode · reviews stay in this browser. Use Export reviews for a backup.');render()}catch(e){message(e.message,true)}};
$('export').onclick=()=>{const rows=[['Application ID','Source row','Name','DS','Policy','Notes'],...applicants.map(a=>[a.id,a.row,name(a),review(a).ds,review(a).policy,review(a).notes])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const link=el('a');link.href=url;link.download='rel-reviews.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
window.addEventListener('beforeunload',e=>{if(dirty&&live){e.preventDefault();e.returnValue=''}});try{Object.entries(JSON.parse(localStorage.getItem('rel-review-drafts-v1')||'{}')).forEach(([k,v])=>drafts.set(k,v))}catch{}
if(live)load();else{applicants=[{id:'demo-1',row:2,review:{ds:'',policy:'',notes:''},fields:[{label:'First Name',value:'Alex'},{label:'Last Name',value:'Rivera (demo)'},{label:'Email Address',value:'alex@example.com'},{label:'Major',value:'Economics & Computer Science'},{label:'Graduation year',value:'2027'},{label:'Applied before?',value:'No'},{label:'Which research areas interest you?',value:'County finance · Community programs · Applied policy'},{label:'Why do you want to join REL, and what do you hope to contribute and learn?',value:'This is a fictional application for previewing the interface.\n\nI would like to connect quantitative research with local policy questions. I hope to contribute Python and data visualization experience, and learn how to turn a broad question into a careful research design.'},{label:'Describe your technical experience',value:'Python, pandas, SQL, introductory statistics, and team projects.'},{label:'Describe your policy experience',value:'Literature reviews, economics coursework, and community volunteering.'},{label:'Rutgers professor / lab interests',value:'Interested in applied economics and evaluating public programs.'},{label:'Resume PDF',value:''},{label:'Unofficial transcript PDF',value:''}]}];activeId=applicants[0].id;dirty=drafts.has(activeId);message('Design preview · fictional applicant. Import your response CSV to review real applications locally. Live Sheets sync requires the bound script.');render()}
</script></body></html>
